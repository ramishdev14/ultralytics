# YOLO11s with Adaptive Dual Attention at P4
# A2 ablation: positive sigmoid residual gate

nc: 4

scale: s

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2

  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4-P3

  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, AdaptiveDualAttention, [32, 7]] # 7-P4 attention

  - [-1, 1, Conv, [1024, 3, 2]]            # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]            # 9
  - [-1, 1, SPPF, [1024, 5]]               # 10
  - [-1, 2, C2PSA, [1024]]                 # 11-P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                  # 13
  - [-1, 2, C3k2, [512, False]]                # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 2, C3k2, [256, False]]                # 17-P3/8

  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 14], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, False]]                # 20-P4/16

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 11], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [1024, True]]                # 23-P5/32

  - [[17, 20, 23], 1, Detect, [nc]]            # 24